[metadata]
name = "expert"
instance_id = "garbage-transport-jurisdiction-no-skill"
task = "legal-document-authoring"
source_repo = ""
language = "en"
programming_language = "python"
prompt_creation_time = "2026-10-18"

[environment]
docker_image = "garbage-transport-jurisdiction-no-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
workdir = "/workspace"
network_mode = "no-network"
build_timeout_sec = 1200.0

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
timeout_sec = 600.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[judge]
type = "mixed"
reward_kind = "continuous"

[solution]
deliverable = "output/jurisdiction.docx"

[verifier.environment]
docker_image = "garbage-transport-jurisdiction-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
network_mode = "public"

[tests]
command = "tests/test.sh"
