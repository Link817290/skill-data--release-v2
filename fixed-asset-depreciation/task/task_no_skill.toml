[[artifacts]]
source = "/workspace/output/fixed_asset_model.xlsx"
destination = "output/fixed_asset_model.xlsx"

[metadata]
name = "d5data / qinhuaizhi"
instance_id = "fixed-asset-depreciation"
task = "fixed-asset-depreciation-management"
source_repo = ""
language = "en"
programming_language = "python"
prompt_creation_time = "2026-10-17"

[environment]
docker_image = "fixed-asset-depreciation-no-skill:1.0"
dockerfile = "environment/Dockerfile.no_skill"
workspace = "environment/workspace"
workdir = "/workspace"
cpus = 4
memory_mb = 4096
network_mode = "no-network"

[agent]
timeout_sec = 5400.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.env]
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[verifier.environment]
docker_image = "fixed-asset-depreciation-verifier:1.0"
workdir = "/workspace"
cpus = 4
memory_mb = 4096
network_mode = "public"

[judge]
type = "mixed"
reward_kind = "continuous"
