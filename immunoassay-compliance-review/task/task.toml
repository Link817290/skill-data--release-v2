version = "1.0"
id = "immunoassay-compliance-review"
title = "Immunoassay Compliance Review"
instruction = "instruction.md"
difficulty = "hard"
language = "zh"
artifacts = ["/workspace/output/review_report.md"]

[environment]
docker_image = "immunoassay-compliance-review:1.3"
dockerfile = "environment/Dockerfile"
docker_target = "with-skill"
workspace = "environment/workspace"
skills = "environment/skills"
skills_dir = "/skills"
workdir = "/workspace"
network_mode = "no-network"
cpus = 4
memory_mb = 8192
build_timeout_sec = 900.0

[agent]
timeout_sec = 5400.0

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[verifier.environment]
docker_image = "immunoassay-compliance-review-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
workdir = "/workspace"
network_mode = "public"
cpus = 4
memory_mb = 8192
build_timeout_sec = 900.0

[judge]
type = "mixed"
reward_kind = "continuous"

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/output/review_report.md"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
