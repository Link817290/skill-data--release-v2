artifacts = ["/workspace/output"]
[metadata]
name = "Customer service quality report"
instance_id = "customer-service-quality-report"
task = "customer-service-operations"
source_repo = ""
language = "en"
programming_language = "python"
prompt_creation_time = "2026-10-19"
[environment]
docker_image = "customer-service-quality-report:1.0"
cpus = 4
workdir = "/workspace"
memory_mb = 8192
network_mode = "no-network"
[agent]
timeout_sec = 5400.0
[verifier]
environment_mode = "separate"
timeout_sec = 900.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/llm-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"
[judge]
type = "mixed"
reward_kind = "continuous"
[tests]
command = "tests/test.sh"
[verifier.environment]
docker_image = "customer-service-quality-report:1.0"
network_mode = "public"
