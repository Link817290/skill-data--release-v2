version = "1.0"
id = "pv-causality-signal-no-skill"
name = "expert/no-skill/pv-causality-signal"
title = "Longitudinal pharmacovigilance adjudication"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = ["/workspace/faers_adjudication.json"]

[metadata]
tags = ["pharmacovigilance", "causality", "longitudinal", "faers", "json"]

[judge]
type = "mixed"
reward_kind = "continuous"

[agent]
timeout_sec = 10800.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[environment]
docker_image = "pv_causality_signal-no-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_access = false
build_timeout_sec = 900.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-900}"

[verifier.environment]
docker_image = "pv_causality_signal-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
network_mode = "public"
workdir = "/workspace"
build_timeout_sec = 900.0

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/faers_adjudication.json"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"
