version = "1.0"
id = "public-recruitment-package"
name = "expert/public-recruitment-package"
title = "Prepare a source-aligned public recruitment package"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = ["/workspace/output/XX融资担保有限公司2026年公开招聘公告.doc", "/workspace/output/附件1某融资担保有限公司2026年公开招聘岗位明细表.xlsx", "/workspace/output/附件2 湖南省2026年考试录用公务员专业指导目录.xlsx", "/workspace/output/附件3某融资担保有限公司公开招聘诚信承诺书.docx"]

[metadata]
tags = ["recruitment", "source-authority", "privacy", "document-production"]

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 5400.0

[environment]
docker_image = "public-recruitment-package-with-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
skills = "environment/skills"
network_access = false
build_timeout_sec = 600.0

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/output"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-240}"

[verifier.environment]
docker_image = "public-recruitment-package-verifier:1.3"
network_mode = "public"
