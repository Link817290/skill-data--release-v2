artifacts = [
  { source = "/workspace/output/cppm_diagnosis.xlsx", destination = "output/cppm_diagnosis.xlsx" },
]

[metadata]
name = "d5data / Jinbao"
instance_id = "customer-complaint-ppm-diagnosis"
task = "spreadsheet-quality-analysis"
source_repo = ""
language = "zh"
programming_language = "python"
prompt_creation_time = "2026-10-08"

[environment]
docker_image = "customer-complaint-ppm-diagnosis:1.0"
cpus = 4
workdir = "/workspace"
memory_mb = 16384
network_mode = "no-network"

[agent]
timeout_sec = 10800.0

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/judge-cache}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[verifier.environment]
docker_image = "customer-complaint-ppm-diagnosis:1.0"
cpus = 4
workdir = "/workspace"
memory_mb = 16384
network_mode = "public"

[judge]
type = "mixed"
reward_kind = "continuous"
