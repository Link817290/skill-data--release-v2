version = "1.0"
id = "exam-conclusion-generation-no-skill"
title = "Physical-Exam Final Review — Conclusion Reconstruction (no-skill control)"
instruction = "instruction.md"
difficulty = "hard"
language = "zh"

[environment]
docker_image = "exam-conclusion-generation-no-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_access = false

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[verifier.environment]
docker_image = "exam-conclusion-generation-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
workdir = "/package/task"
network_mode = "public"

[solution]
script = "solution/solve.sh"
deliverable = "solution/gold_payload.json"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[judge]
type = "mixed"
reward_kind = "continuous"
