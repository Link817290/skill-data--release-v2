[metadata]
name = ""
instance_id = "skeletal-animation-production-ops"
task = "godot-skill-effects-integration"
source_repo = ""
language = "en"
programming_language = "gdscript,python"
prompt_creation_time = "2026-10-15"

[environment]
docker_image = "skeletal-animation-production-ops:1.3"
cpus = 2
memory_mb = 4096
workdir = "/workspace"
network_mode = "no-network"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
skills = "environment/skills"
build_timeout_sec = 1800

[agent]
timeout_sec = 7200

[verifier]
environment_mode = "shared"
timeout_sec = 3600

[judge]
type = "mixed"
reward_kind = "continuous"

[skill]
active = ["effect-lifecycle-measurement", "preview-delivery-validation", "sequence-display-measurement"]

[solution]
script = "solution/solve.sh"
deliverable = "workspace/output"

[tests]
command = "tests/test.sh"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"
