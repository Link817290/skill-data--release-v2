artifacts = ["/workspace/output"]

[metadata]
name = "Delivery coverage decision"
instance_id = "delivery-coverage-decision"
task = "operational-decision-analysis"
source_repo = ""
language = "en"
programming_language = "python"
prompt_creation_time = "2026-10-19"

[environment]
docker_image = "delivery-coverage-decision:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
skills = "environment/skills"
skills_dir = "/skills"
cpus = 4
workdir = "/workspace"
memory_mb = 8192
network_mode = "no-network"

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier.environment]
docker_image = "delivery-coverage-decision-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
cpus = 4
memory_mb = 8192
workdir = "/workspace"
network_mode = "public"

[tests]
command = "tests/test.sh"
