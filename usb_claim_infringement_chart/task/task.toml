version = "1.0"
id = "usb_claim_infringement_chart"
title = "USB Charging Patent Claim Chart"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = ["/workspace/claim_chart.json"]

[environment]
docker_image = "usb-claim-infringement-chart:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
skills = "environment/skills"
skills_dir = "/skills"
workdir = "/workspace"
network_mode = "public"
build_timeout_sec = 1200.0

[skill]
active = ["patent-claim-version-triage"]

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "shared"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/claim_chart.json"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[judge]
type = "mixed"
reward_kind = "continuous"
