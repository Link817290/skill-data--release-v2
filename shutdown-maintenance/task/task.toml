version = "1.0"
id = "shutdown-maintenance"
title = "Shutdown Maintenance"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = ["/workspace/output"]

[environment]
docker_image = "shutdown-maintenance:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
skills = "environment/skills"
skills_dir = "/skills"
cpus = 4
memory_mb = 8192
workdir = "/workspace"
network_mode = "public"
build_timeout_sec = 1200.0

[skill]
active = ["schedule-maintenance-resources", "plan-maintenance-handback"]

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "shared"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/output"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"

[judge]
type = "mixed"
reward_kind = "continuous"
