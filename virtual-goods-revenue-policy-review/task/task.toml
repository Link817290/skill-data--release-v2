version = "1.3"
id = "virtual-goods-revenue-policy-review"
title = "Longitudinal Revenue-Recognition Policy and Control Review"
instruction = "instruction.md"
difficulty = "hard"
language = "en"

[metadata]
tags = ["financial-reporting", "revenue-recognition", "audit-review"]

[agent]
timeout_sec = 5400.0

[verifier]
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_REASONING_EFFORT = "${LLM_JUDGE_REASONING_EFFORT:-xhigh}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[judge]
type = "mixed"
reward_kind = "continuous"

[environment]
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
skills = "environment/skills"
network_access = false

[solution]
script = "solution/solve.sh"
deliverable = "solution/golden_deliverable.md"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

# Rollout observations are intentionally excluded from a release package.
# External runners use dataset.toml to select their rollout matrix.
