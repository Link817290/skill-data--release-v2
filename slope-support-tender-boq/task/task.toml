[metadata]
name = "d5data / benchmark author"
instance_id = "slope-support-tender-boq"
task = "construction-cost-engineering"
language = "en"
programming_language = "python"

[environment]
docker_image = "slope-support-tender-boq-with-skill:1.3"
cpus = 4
workdir = "/workspace"
memory_mb = 8192
network_mode = "no-network"

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0

[verifier.environment]
docker_image = "slope-support-tender-boq-verifier:1.3"
workdir = "/workspace"
network_mode = "public"
cpus = 4
memory_mb = 8192

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/task/tests/mix_judge/replay}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[judge]
type = "mixed"
reward_kind = "continuous"
