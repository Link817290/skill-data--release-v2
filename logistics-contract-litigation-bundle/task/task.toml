version = "1.0"
id = "logistics-contract-litigation-bundle"
name = "expert/logistics-contract-litigation-bundle"
title = "logistics-contract-litigation-bundle"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = [ "/workspace/output/service-address-confirmation.docx", "/workspace/output/civil-complaint.docx", "/workspace/output/case-handoff.docx", "/workspace/output/evidence-list.docx", "/workspace/output/refund-account-confirmation.docx",]

[metadata]
tags = [ "logistics-contract-litigation-bundle",]

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 5400.0

[environment]
docker_image = "logistics-contract-litigation-bundle-with-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_access = false
build_timeout_sec = 900.0
skills = "environment/skills"

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/output"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-240}"

[verifier.environment]
docker_image = "logistics-contract-litigation-bundle-verifier:1.3"
network_mode = "public"
