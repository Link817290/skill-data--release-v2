artifacts = ["/workspace/employee_equity_dilution_ledger.xlsx"]
version = "1.0"
id = "employee_equity_dilution_ledger-no-skill"
title = "Employee Equity Plan Dilution and Exercise Ledger (no-skill control)"
instruction = "instruction.md"
difficulty = "hard"
language = "en"

[environment]
docker_image = "employee-equity-dilution-ledger:1.0"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_access = false

[solution]
script = "solution/solve.sh"
deliverable = "workspace/employee_equity_dilution_ledger.xlsx"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/judge-cache}"

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier.environment]
docker_image = "employee-equity-dilution-ledger:1.0"
workdir = "/workspace"
network_mode = "public"
