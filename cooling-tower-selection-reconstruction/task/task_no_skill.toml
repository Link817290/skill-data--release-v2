artifacts = [{ source = "/workspace/output/cooling_tower.xlsx", destination = "output/cooling_tower.xlsx" }]

[metadata]
name = "d5data / qinhuaizhi (no skill)"
instance_id = "cooling-tower-selection-reconstruction-no-skill"
task = "cooling-tower-thermal-design"
source_repo = ""
language = "en"
programming_language = "python"
prompt_creation_time = "2026-10-14"

[environment]
docker_image = "cooling-tower-selection-reconstruction-no-skill:1.0"
workdir = "/workspace"
cpus = 4
memory_mb = 16384
network_mode = "no-network"

[agent]
timeout_sec = 5400.0

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0
user = "root"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL:-}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY:-}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[verifier.environment]
docker_image = "cooling-tower-selection-reconstruction-verifier:1.0"
workdir = "/workspace"
cpus = 4
memory_mb = 16384
network_mode = "public"

[judge]
type = "mixed"
reward_kind = "continuous"

[solution]
deliverable = "output/cooling_tower.xlsx"

[tests]
command = "tests/test.sh"
