version = "1.0"
id = "membership-weekly-report"
title = "Membership weekly report"
task_type = "skill-bench"
domain = "business reporting"
language = "zh"
difficulty = "hard"
instruction = "task/instruction.md"
task = "task/task.toml"
task_no_skill = "task/task_no_skill.toml"
rubric = "RUBRIC.md"
golden = "golden"
required_outputs = [ "/workspace/output/weekly_report.docx",]
network_access = false

[scoring]
primary_score = "reward"
reward_alias = "strict"
strict_formula = "documented in RUBRIC.md and implemented by task/tests/validator.py"
score_lenses = [ "strict", "lenient",]
scorer = "task/tests/validator.py"
condition_blind = true
same_scorer_for_with_no_skill = true
answer_judge_llm_used = true

[conditions]
answers_in_skill = false
thresholds_in_skill = false
condition_blind = true

[scoring.verified]
gold_reward = 1.0
gold_reward_strict = 1.0
gold_reward_lenient = 1.0
