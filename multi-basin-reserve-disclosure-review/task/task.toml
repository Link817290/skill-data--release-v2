version = "1.0"
id = "multi-basin-reserve-disclosure-review"
name = "expert/multi-basin-reserve-disclosure-review"
title = "Year-end Reserve Disclosure Exception Review"
instruction = "instruction.md"
difficulty = "expert"
language = "en"
artifacts = [ "/workspace/output/reserve_disclosure_review.md", "/workspace/output/reserve_disclosure_register.csv",]

[metadata]
tags = [ "multi-basin-reserve-disclosure-review",]

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 7200.0

[environment]
docker_image = "multi-basin-reserve-disclosure-review-with-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_access = false
build_timeout_sec = 1200.0
skills = "environment/skills"

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/output"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-240}"

[verifier.environment]
docker_image = "multi-basin-reserve-disclosure-review-verifier:1.3"
network_mode = "public"
