version = "1.0"
id = "parking-barrier-quotation"
name = "expert/parking-barrier-quotation"
title = "Car park barrier system customer quotation"
instruction = "instruction.md"
difficulty = "hard"
language = "zh"
artifacts = [ "/workspace/output/quotation.xlsx",]

[metadata]
tags = [ "parking-barrier-quotation",]

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 5400.0

[environment]
docker_image = "parking-barrier-quotation-with-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_access = false
build_timeout_sec = 1200.0
skills = "environment/skills"

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/output/quotation.xlsx"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-240}"

[verifier.environment]
docker_image = "parking-barrier-quotation-verifier:1.3"
network_mode = "public"
