version = "1.0"
id = "rest-day-hours-reconciliation"
name = "expert/rest-day-hours-reconciliation"
title = "Rest-day attendance and compensatory-leave reconciliation"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = ["/workspace/output/rest-day-review.xlsx", "/workspace/output/review-conclusions.txt"]

[metadata]
tags = ["human-resources", "attendance", "compensatory-leave", "evidence-reconciliation"]

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 7200.0

[environment]
docker_image = "rest-day-hours-reconciliation-with-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_access = false
build_timeout_sec = 1200.0
skills = "environment/skills"

[solution]
script = "solution/solve.sh"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-240}"

[verifier.environment]
docker_image = "rest-day-hours-reconciliation-verifier:1.3"
network_mode = "public"
