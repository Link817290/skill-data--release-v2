version = "1.0"
id = "hydrology-citation-reconciliation-no-skill"
title = "Author-date Citation Reconciliation"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = ["/workspace/output/citation_reconciliation.md"]

[environment]
docker_image = "hydrology-citation-reconciliation-no-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_mode = "no-network"
workdir = "/workspace"
build_timeout_sec = 1200.0

[agent]
timeout_sec = 5400.0

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-900}"

[verifier.environment]
docker_image = "hydrology-citation-reconciliation-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
network_mode = "public"
workdir = "/workspace"
build_timeout_sec = 1200.0

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/output/citation_reconciliation.md"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[judge]
type = "mixed"
reward_kind = "continuous"
