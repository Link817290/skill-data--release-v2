id = "general-average-allocation-review"
title = "General-average allocation review"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = [
  "/workspace/deliverables/general_average_review.md",
  "/workspace/deliverables/general_average_schedule.csv",
]

[agent]
timeout_sec = 7200.0

[environment]
docker_image = "general-average-allocation-review-skills:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
skills = "environment/skills"
skills_dir = "/skills"
network_mode = "no-network"
network_access = false
workdir = "/workspace"
build_timeout_sec = 600.0

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 900.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-240}"

[verifier.environment]
docker_image = "general-average-allocation-review-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
network_mode = "public"
workdir = "/workspace"
build_timeout_sec = 600.0

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/deliverables/general_average_review.md"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[judge]
type = "mixed"
reward_kind = "continuous"
