artifacts = ["/workspace/output"]

[metadata]
name = "Offline measurement-control utility"
instance_id = "calibration-impact-review"
task = "offline-tool-implementation"
language = "en"
programming_language = "python"
prompt_creation_time = "2026-10-19"
source_repo = "business-analysis-bench"

[environment]
docker_image = "calibration-impact-review-with-skill:20261104"
skills_dir = "/skills"
cpus = 4
workdir = "/workspace"
memory_mb = 8192
network_mode = "no-network"

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL:-}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY:-}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier.environment]
docker_image = "calibration-impact-review-verifier:20261104"
cpus = 4
memory_mb = 8192
workdir = "/workspace"
network_mode = "public"
