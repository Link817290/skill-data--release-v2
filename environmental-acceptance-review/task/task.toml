artifacts = ["/workspace/output"]
[metadata]
name = "environmental-acceptance-review"
instance_id = "environmental-acceptance-review"
task = "business-productivity"
source_repo = ""
language = "en"
programming_language = "python"
prompt_creation_time = "2026-10-20"
[environment]
docker_image = "environmental-acceptance-review:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
skills = "environment/skills"
skills_dir = "/skills"
cpus = 4
workdir = "/workspace"
memory_mb = 8192
network_mode = "no-network"
build_timeout_sec = 1200.0
[agent]
timeout_sec = 7200.0
[verifier]
environment_mode = "separate"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"

[verifier.environment]
docker_image = "environmental-acceptance-review-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
cpus = 4
memory_mb = 8192
workdir = "/workspace"
network_mode = "public"
[judge]
type = "mixed"
reward_kind = "continuous"
[solution]
deliverable = "output/一期工程验收监测报告表（批注稿）.docx; output/验收材料补充意见.docx"

[tests]
command = "tests/test.sh"
