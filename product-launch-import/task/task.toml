version = "1.3"
id = "product-launch-import"
name = "business/product-launch-import"
title = "Product Launch Import"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = ["/workspace/output/products.csv"]

[metadata]
tags = ["catalog", "commerce", "data-import"]
source_language = "zh-CN"
deliverable_language = "en"

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"

[verifier.environment]
docker_image = "product-launch-import-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
network_mode = "public"

[agent]
timeout_sec = 7200.0

[environment]
docker_image = "product-launch-import-with-skill:1.3"
dockerfile = "environment/Dockerfile.skills"
workspace = "environment/workspace"
skills = "environment/skills"
network_access = false
build_timeout_sec = 900.0

[solution]
deliverable = "output/products.csv"

[tests]
command = "tests/test.sh"
validator = "tests/evaluate.py"
