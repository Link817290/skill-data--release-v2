version = "1.0"
id = "manuscript-citation-reconciliation"
title = "Manuscript citation reconciliation"
task_type = "skill-bench"
domain = "citation audit"
language = "en"
difficulty = "hard"
instruction = "task/instruction.md"
task = "task/task.toml"
task_no_skill = "task/task_no_skill.toml"
rubric = "RUBRIC.md"
golden = "golden"
required_outputs = [ "/workspace/output/citation_audit.json",]
network_access = false

[scoring]
primary_score = "reward"
