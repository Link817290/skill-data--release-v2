version = "1.0"
id = "life-insurance-channel-outlook-no-skill"
name = "expert/no-skill/life-insurance-channel-outlook"
title = "life-insurance-channel-outlook"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = [ "/workspace/output/report.pdf",]

[metadata]
tags = [ "life-insurance-channel-outlook",]

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[agent]
timeout_sec = 7200.0

[environment]
docker_image = "life-insurance-channel-outlook-no-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_access = false
build_timeout_sec = 1200.0

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/output/report.pdf"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-240}"

[verifier.environment]
docker_image = "life-insurance-channel-outlook-verifier:1.3"
network_mode = "public"
