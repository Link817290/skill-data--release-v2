artifacts = ["/workspace/beam_review.xlsx"]

[metadata]
name = "rc_beam_load_rebar_review-no-skill"
instance_id = "rc_beam_load_rebar_review-no-skill"
task = "reinforced-concrete-beam-review"
source_repo = ""
language = "en"
programming_language = "python"
prompt_creation_time = "2026-11-07"

[environment]
docker_image = "rc_beam_load_rebar_review-no-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
workdir = "/workspace"
cpus = 4
memory_mb = 16384
network_mode = "no-network"
build_timeout_sec = 900.0

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
user = "1000"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-fresh}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-900}"

[verifier.environment]
docker_image = "rc_beam_load_rebar_review-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
workdir = "/workspace"
cpus = 4
memory_mb = 16384
network_mode = "public"
build_timeout_sec = 900.0

[judge]
type = "mixed"
reward_kind = "continuous"

[tests]
command = "tests/test.sh"
