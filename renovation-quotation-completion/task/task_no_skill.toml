version = "1.0"
id = "renovation-quotation-completion-no-skill"
title = "Renovation Quotation Completion"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = ["/workspace/output"]

[environment]
docker_image = "renovation-quotation-completion-no-skill:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
network_mode = "no-network"
workdir = "/workspace"
build_timeout_sec = 1200.0

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/llm-judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-900}"

[verifier.environment]
docker_image = "renovation-quotation-completion:1.3"
dockerfile = "environment/Dockerfile"
network_mode = "public"
workdir = "/workspace"
build_timeout_sec = 1200.0

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/output"

[tests]
command = "tests/test.sh"

[judge]
type = "mixed"
reward_kind = "continuous"
