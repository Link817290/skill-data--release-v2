[metadata]
name = "d5data / benchmark author"
instance_id = "residential-roof-repair"
task = "repair-scope-enquiry"
source_repo = "author-created/residential-roof-repair"
language = "en"
programming_language = "python"
prompt_creation_time = "2026-10-19"

[environment]
docker_image = "residential-roof-repair-no-skill:1.3"
cpus = 4
workdir = "/workspace"
memory_mb = 8192
network_mode = "no-network"

[agent]
timeout_sec = 7200.0

[verifier]
environment_mode = "shared"
timeout_sec = 1800.0
network_mode = "public"

[judge]
type = "mixed"
reward_kind = "continuous"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"
