schema_version = "1.3"
artifacts = ["/workspace/output/orbit_evidence.json", "/workspace/materials"]

[metadata]
name = "cif-orbit-evidence"
difficulty = "hard"
category = "crystallography"

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
user = "root"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"

LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"
[judge]
type = "mixed"
reward_kind = "continuous"

[verifier.environment]
docker_image = "cif-orbit-private-verifier:1.0"
network_mode = "public"
workdir = "/workspace"

[environment]
docker_image = "cif-orbit-actor-with-skill:1.0"
skills_dir = "/skills"
network_mode = "no-network"
workdir = "/workspace"
build_timeout_sec = 600.0
