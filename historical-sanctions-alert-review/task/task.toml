version = "1.0"
id = "historical-sanctions-alert-review"
title = "Historical Sanctions Alert and AML Review"
instruction = "instruction.md"
difficulty = "hard"
language = "en"
artifacts = ["/workspace/alert_review.json"]

[environment]
docker_image = "historical-sanctions-alert-review:1.3"
dockerfile = "environment/Dockerfile"
workspace = "environment/workspace"
skills = "environment/skills"
skills_dir = "/skills"
network_mode = "no-network"
workdir = "/workspace"
build_timeout_sec = 1200.0

[skill]
active = ["historical-alert-adjudication", "aml-case-escalation"]

[agent]
timeout_sec = 5400.0

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800.0

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-/logs/verifier/judge-cache}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-900}"

[verifier.environment]
docker_image = "historical-sanctions-alert-review-verifier:1.3"
dockerfile = "environment/Dockerfile.verifier"
network_mode = "public"
workdir = "/workspace"
build_timeout_sec = 1200.0

[solution]
script = "solution/solve.sh"
deliverable = "/workspace/alert_review.json"

[tests]
command = "tests/test.sh"
validator = "tests/validator.py"
ground_truth = "tests/ground_truth.json"

[judge]
type = "mixed"
reward_kind = "continuous"
