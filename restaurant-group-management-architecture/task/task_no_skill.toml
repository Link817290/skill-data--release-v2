id = "restaurant-group-management-architecture-no-skill"
title = "Restaurant group management architecture (no skill)"
instruction = "instruction.md"
language = "en"

[metadata]
tags = ["organization-design", "management-control", "mixed-judge", "no-skill"]

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 5400.0

[environment]
dockerfile = "environment/Dockerfile"
verifier_dockerfile = "environment/Dockerfile.verifier"
workspace = "environment/workspace"
network_access = false
build_timeout_sec = 600.0

[solution]
script = "solution/solve.sh"
deliverable = "workspace/output/control-system-and-long-term-architecture.md"

[tests]
command = "tests/test.sh"

[verifier.env]
LLM_JUDGE_BASE_URL = "${LLM_JUDGE_BASE_URL}"
LLM_JUDGE_API_KEY = "${LLM_JUDGE_API_KEY}"
LLM_JUDGE_MODEL = "${LLM_JUDGE_MODEL:-gpt-5.6-sol}"
LLM_JUDGE_CACHE_DIR = "${LLM_JUDGE_CACHE_DIR:-}"
LLM_JUDGE_MODE = "${LLM_JUDGE_MODE:-auto}"
LLM_JUDGE_TIMEOUT_SECONDS = "${LLM_JUDGE_TIMEOUT_SECONDS:-600}"
